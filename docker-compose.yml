
name: library-system

services:

  # =========================
  # API GATEWAY
  # =========================

  api-gateway:
    build:
      context: ./ApiGateway
    container_name: library-api-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
    depends_on:
      - member-service-0
      - member-service-1
      - member-service-2
      - member-service-3
    networks:
      - library-network
    restart: unless-stopped

  # =========================
  # MEMBER SERVICE SHARDS
  # =========================

  member-service-0:
    build:
      context: ./MemberService
    container_name: member-service-0
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://member-db-0:5432/members_0
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SHARD_ID: 0
    ports:
      - "8081:8080"
    depends_on:
      member-db-0:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - library-network
    restart: unless-stopped

  member-service-1:
    build:
      context: ./member-service
    container_name: member-service-1
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://member-db-1:5432/members_1
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SHARD_ID: 1
    ports:
      - "8082:8080"
    depends_on:
      member-db-1:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - library-network
    restart: unless-stopped

  member-service-2:
    build:
      context: ./member-service
    container_name: member-service-2
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://member-db-2:5432/members_2
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SHARD_ID: 2
    ports:
      - "8083:8080"
    depends_on:
      member-db-2:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - library-network
    restart: unless-stopped

  member-service-3:
    build:
      context: ./member-service
    container_name: member-service-3
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://member-db-3:5432/members_3
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SHARD_ID: 3
    ports:
      - "8084:8080"
    depends_on:
      member-db-3:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - library-network
    restart: unless-stopped

  # =========================
  # POSTGRESQL SHARD DATABASES
  # =========================

  member-db-0:
    image: postgres:17
    container_name: member-db-0
    environment:
      POSTGRES_DB: members_0
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - member-db-0-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d members_0"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - library-network
    restart: unless-stopped

  member-db-1:
    image: postgres:17
    container_name: member-db-1
    environment:
      POSTGRES_DB: members_1
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - member-db-1-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d members_1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - library-network
    restart: unless-stopped

  member-db-2:
    image: postgres:17
    container_name: member-db-2
    environment:
      POSTGRES_DB: members_2
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - member-db-2-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d members_2"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - library-network
    restart: unless-stopped

  member-db-3:
    image: postgres:17
    container_name: member-db-3
    environment:
      POSTGRES_DB: members_3
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - member-db-3-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d members_3"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - library-network
    restart: unless-stopped

  # =========================
  # APACHE KAFKA (KRaft)
  # =========================

  kafka:
    image: apache/kafka:4.1.0
    container_name: library-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - library-network
    restart: unless-stopped

# =========================
# NETWORKS
# =========================

networks:
  library-network:
    driver: bridge

# =========================
# VOLUMES
# =========================

volumes:
  member-db-0-data:
  member-db-1-data:
  member-db-2-data:
  member-db-3-data:
  kafka-data:
