spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: member-shard-0
          uri: http://member-service-0:8080
          predicates:
            - Path=/api/v1/shards/0/**
          filters:
            - StripPrefix=4

        - id: member-shard-1
          uri: http://member-service-1:8080
          predicates:
            - Path=/api/v1/shards/1/**
          filters:
            - StripPrefix=4

        - id: member-shard-2
          uri: http://member-service-2:8080
          predicates:
            - Path=/api/v1/shards/2/**
          filters:
            - StripPrefix=4

        - id: member-shard-3
          uri: http://member-service-3:8080
          predicates:
            - Path=/api/v1/shards/3/**
          filters:
            - StripPrefix=4

server:
  port: 8080
